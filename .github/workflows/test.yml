name: Game checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  simulation-and-lan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2
        run: |
          mkdir -p tools/editor
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d tools/editor
          chmod +x tools/editor/*
      - name: Import resources
        run: tools/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import --quit
      - name: Simulation and four-process LAN
        run: python3 scripts/verify.py
